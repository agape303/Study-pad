<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2446c9">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Study Pad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@500;700&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column. Upload card first, then lesson picker, four study tabs (Read, Key points, Cards, Quiz) and a panel. */
:root {
  --bg: #eef1f7;
  --surface: #ffffff;
  --fg: #151c2e;
  --muted: #5b667e;
  --line: #d3d9e6;
  --accent: #2446c9;
  --accent-ink: #ffffff;
  --mark: #ffe58a;
  --good: #2b8a3e;
  --good-bg: #e3f4e6;
  --bad: #c2321f;
  --bad-bg: #fbe6e2;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1320; --surface: #171e31; --fg: #e6eaf6; --muted: #97a3bf; --line: #283250;
    --accent: #7c97ff; --accent-ink: #0a1030; --mark: #6b5a12; --good: #6fdc86; --good-bg: #17301f;
    --bad: #ff8a78; --bad-bg: #3a1a16; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #171e31; --fg: #e6eaf6; --muted: #97a3bf; --line: #283250;
  --accent: #7c97ff; --accent-ink: #0a1030; --mark: #6b5a12; --good: #6fdc86; --good-bg: #17301f;
  --bad: #ff8a78; --bad-bg: #3a1a16; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1.05; margin: 0; letter-spacing: -0.02em; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.btn { font: inherit; font-weight: 700; min-height: 46px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn:disabled { opacity: 0.5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1; }
.note { color: var(--muted); font-size: 0.88rem; margin: 0; }
.status { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); min-height: 1.3em; margin: 0; }
select { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; min-height: 46px; padding: 0 10px; max-width: 100%; }
.docname { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--good); transition: width 0.3s; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tab { font: inherit; font-weight: 700; font-size: 0.9rem; min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; padding: 0 4px; }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.read p { font-family: var(--font-read); font-size: 1.08rem; line-height: 1.7; margin: 0 0 1em; overflow-wrap: anywhere; }
.read p:last-child { margin-bottom: 0; }
mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }
.label { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.point { font-family: var(--font-read); font-size: 1.05rem; line-height: 1.6; padding-left: 14px; border-left: 3px solid var(--accent); margin: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--font-mono); font-size: 0.85rem; background: var(--mark); color: var(--fg); padding: 4px 10px; border-radius: 999px; }
.q { font-family: var(--font-read); font-size: 1.12rem; line-height: 1.6; margin: 0; overflow-wrap: anywhere; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2.5px solid var(--accent); text-align: center; font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { font: inherit; text-align: left; min-height: 48px; padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.opt.right { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 700; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.answer { font-weight: 700; color: var(--good); margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 18px 6px; }
button:focus-visible, select:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<style>body{margin:0}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Study Pad</h1>
    <p class="sub">Add a PDF. It is split into short lessons you can read, listen to, and practise with flashcards and a quiz.</p>
  </header>

  <section class="card" id="intake">
    <div class="row">
      <label class="btn grow" id="pickLabel" for="file">Choose a PDF</label>
      <input type="file" id="file" accept="application/pdf,.pdf">
      <button class="btn ghost grow" id="sampleBtn" type="button">Try a sample</button>
    </div>
    <p class="status" id="status" role="status"></p>
    <p class="note">Your PDF is read on your phone and is not uploaded anywhere. It works with PDFs that have real text. Scanned pages made of photos cannot be read.</p>
  </section>

  <section class="card" id="study" hidden>
    <div class="row">
      <div class="docname grow" id="docName"></div>
      <button class="btn ghost" id="changeBtn" type="button">New PDF</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="prevBtn" type="button" aria-label="Previous lesson">◀</button>
      <select class="grow" id="lessonSel" aria-label="Choose lesson"></select>
      <button class="btn ghost" id="nextBtn" type="button" aria-label="Next lesson">▶</button>
    </div>
    <div>
      <div class="row"><span class="label" id="progLabel"></span></div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
    <div class="tabs" role="group" aria-label="Study mode">
      <button class="tab" type="button" data-tab="read">Read</button>
      <button class="tab" type="button" data-tab="points">Key points</button>
      <button class="tab" type="button" data-tab="cards">Cards</button>
      <button class="tab" type="button" data-tab="quiz">Quiz</button>
    </div>
  </section>

  <section class="card" id="panel" hidden aria-live="polite"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var STOP = "about above after again against all also although always among and another any are because been before being below between both but can cannot could did does doing down during each either else even ever every few for from further had has have having her here hers him his how however into its itself just more most much must neither nor not now off once only other our ours out over own same she should since some such than that the their theirs them then there these they this those through thus too under until upon very was were what when where whether which while who whom whose why will with within without would you your yours may might shall many often usually like make makes made use used using can will called whole build adding three several first second third take takes taken give gives given need needs help helps become becomes things thing really great little".split(" ");
  var STOPSET = {}; STOP.forEach(function (w) { STOPSET[w] = 1; });

  var SAMPLE = {
    name: "Sample: How websites work",
    lessons: [
      { label: "What happens when you open a website", text: "A website is a group of files stored on a computer called a server. When you type a website address into your browser, the browser sends a request across the internet to that server. The server finds the right files and sends them back as a response. Your browser then reads those files and shows the page on your screen. This whole trip usually takes less than a second.\n\nEvery website address contains a domain name, which is an easy name that points to the real number of the server, called an IP address. A browser cannot find a server without a domain name or an IP address." },
      { label: "The three languages of the web", text: "Most web pages are built from three languages. HTML describes the structure of a page, such as headings, paragraphs, images and links. CSS describes the style of a page, such as colors, fonts and spacing. JavaScript describes the behavior of a page, such as what happens when a visitor taps a button.\n\nA page can work with HTML alone, but it will look plain. Adding CSS makes the page attractive. Adding JavaScript makes the page interactive. Every web developer needs to understand how these three languages work together to build a page." },
      { label: "Making a page available online", text: "After you build a website, visitors cannot see it until you publish it. Publishing means placing your files on a server that stays connected to the internet. Many developers use free hosting services to publish their first website.\n\nA hosting service gives your website an address that anyone can open in a browser. When you change your files, you upload the new files to the hosting service so the website updates. Beginners should publish small projects often, because every published project becomes proof of their skills." }
    ]
  };

  var doc = null, cur = 0, tab = "read", studied = {}, docKey = "", freq = {}, state = {};
  var speaking = false;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function setStatus(t) { $("status").textContent = t || ""; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- reading the PDF ---------- */
  function pageParas(items) {
    var lines = [], line = "", lastY = null, gaps = [];
    items.forEach(function (it) {
      if (!it.str && !it.hasEOL) return;
      var y = it.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) {
        lines.push({ t: line.trim(), gap: Math.abs(y - lastY) }); gaps.push(Math.abs(y - lastY)); line = "";
      }
      line += it.str; lastY = y;
    });
    if (line.trim()) lines.push({ t: line.trim(), gap: 0 });
    var sorted = gaps.slice().sort(function (a, b) { return a - b; });
    var med = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 12;
    var paras = [], p = "";
    lines.forEach(function (l, i) {
      if (!l.t) return;
      if (p) { p = /-$/.test(p) ? p.slice(0, -1) + l.t : p + " " + l.t; } else p = l.t;
      var next = lines[i];
      if (l.gap > med * 1.6 || /[.!?:]$/.test(l.t) && l.gap > med * 1.25) { paras.push(p); p = ""; }
    });
    if (p) paras.push(p);
    return paras;
  }

  async function readPdf(file) {
    if (typeof pdfjsLib === "undefined") { setStatus("The PDF reader could not load. Check your internet and try again."); return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    try {
      setStatus("Opening " + file.name + "...");
      var buf = await file.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      var pages = [];
      for (var i = 1; i <= pdf.numPages; i++) {
        setStatus("Reading page " + i + " of " + pdf.numPages + "...");
        var pg = await pdf.getPage(i), tc = await pg.getTextContent();
        pages.push({ n: i, paras: pageParas(tc.items) });
      }
      var lessons = [], acc = [], len = 0, start = 0;
      pages.forEach(function (p, idx) {
        var txt = p.paras.join(" ");
        if (!acc.length) start = p.n;
        acc = acc.concat(p.paras); len += txt.length;
        if (len >= 1400 || idx === pages.length - 1) {
          if (len > 0) lessons.push({ label: start === p.n ? "Page " + start : "Pages " + start + " to " + p.n, text: acc.join("\n\n") });
          acc = []; len = 0;
        }
      });
      if (!lessons.length) { setStatus("No readable text found. This PDF may be scanned pages (photos of text)."); return; }
      load({ name: file.name.replace(/\.pdf$/i, ""), lessons: lessons }, file.name + "|" + file.size);
    } catch (e) {
      setStatus("This PDF could not be opened. It may be locked or damaged. Try another file.");
    }
  }

  /* ---------- analysis ---------- */
  function words(s) { return (s.toLowerCase().match(/[a-z][a-z'-]{3,}/g) || []).filter(function (w) { return !STOPSET[w]; }); }
  function sentences(text) {
    var out = [];
    text.split(/\n+/).forEach(function (p) {
      p.split(/(?<=[.!?])\s+(?=[A-Z0-9"“(])/).forEach(function (s) { s = s.trim(); if (s.length >= 40 && s.length <= 280) out.push(s); });
    });
    return out;
  }
  function analyse(d) {
    freq = {};
    d.lessons.forEach(function (l) { words(l.text).forEach(function (w) { freq[w] = (freq[w] || 0) + 1; }); });
    d.lessons.forEach(function (l) {
      var ss = sentences(l.text);
      var lw = {}; words(l.text).forEach(function (w) { lw[w] = (lw[w] || 0) + 1; });
      var scored = ss.map(function (s, i) {
        var ws = words(s), seen = {}, sc = 0;
        ws.forEach(function (w) { if (!seen[w]) { seen[w] = 1; sc += (freq[w] || 1); } });
        return { s: s, i: i, score: ws.length ? sc / Math.sqrt(ws.length) : 0 };
      });
      l.sents = ss;
      l.top = scored.slice().sort(function (a, b) { return b.score - a.score; }).slice(0, 4).sort(function (a, b) { return a.i - b.i; }).map(function (x) { return x.s; });
      l.terms = Object.keys(lw).filter(function (w) { return w.length >= 5; }).sort(function (a, b) { return (lw[b] * 2 + (freq[b] || 0)) - (lw[a] * 2 + (freq[a] || 0)); }).slice(0, 10);
      var pool = l.terms.concat(Object.keys(freq).filter(function (w) { return w.length >= 5; }).sort(function (a, b) { return freq[b] - freq[a]; }).slice(0, 30));
      var uniquePool = pool.filter(function (w, i) { return pool.indexOf(w) === i; });
      l.cloze = scored.sort(function (a, b) { return b.score - a.score; }).slice(0, 10).map(function (x) {
        var cands = (x.s.match(/[A-Za-z][A-Za-z'-]{4,}/g) || []).filter(function (w) { return !STOPSET[w.toLowerCase()]; });
        if (!cands.length) return null;
        cands.sort(function (a, b) { return ((freq[b.toLowerCase()] || 0) * 10 + b.length) - ((freq[a.toLowerCase()] || 0) * 10 + a.length); });
        var ans = cands[0], re = new RegExp("\\b" + ans.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
        var dist = shuffle(uniquePool.filter(function (w) { return w !== ans.toLowerCase(); })).slice(0, 3);
        if (dist.length < 3) return null;
        var opts = shuffle(dist.concat([ans.toLowerCase()]));
        return { text: x.s.replace(re, "_____"), answer: ans.toLowerCase(), shown: ans, opts: opts };
      }).filter(Boolean);
    });
  }

  /* ---------- state ---------- */
  function load(d, key) {
    stopSpeech(); doc = d; docKey = "studypad.v1." + key; cur = 0; tab = "read"; state = {};
    studied = {}; try { studied = JSON.parse(localStorage.getItem(docKey) || "{}") || {}; } catch (e) {}
    analyse(d);
    $("intake").hidden = true; $("study").hidden = false; $("panel").hidden = false;
    $("docName").textContent = d.name;
    $("lessonSel").innerHTML = d.lessons.map(function (l, i) { return '<option value="' + i + '">' + (i + 1) + ". " + esc(l.label.length > 40 ? l.label.slice(0, 40) + "..." : l.label) + "</option>"; }).join("");
    setStatus(""); render();
  }
  function saveStudied() { try { localStorage.setItem(docKey, JSON.stringify(studied)); } catch (e) {} }

  /* ---------- rendering ---------- */
  function render() {
    var l = doc.lessons[cur];
    $("lessonSel").value = String(cur);
    $("prevBtn").disabled = cur === 0; $("nextBtn").disabled = cur === doc.lessons.length - 1;
    var done = Object.keys(studied).length, total = doc.lessons.length;
    $("progLabel").textContent = done + " of " + total + " lessons studied";
    $("progBar").style.width = Math.round(done / total * 100) + "%";
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-tab") === tab)); });
    var h = "";
    if (tab === "read") h = renderRead(l);
    else if (tab === "points") h = renderPoints(l);
    else if (tab === "cards") h = renderCards(l);
    else h = renderQuiz(l);
    $("panel").innerHTML = h;
  }

  function renderRead(l) {
    var terms = l.terms.slice(0, 8);
    var paras = l.text.split(/\n+/).map(function (p) {
      var t = esc(p);
      terms.forEach(function (w) { t = t.replace(new RegExp("\\b(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")\\b", "i"), "<mark>$1</mark>"); });
      return "<p>" + t + "</p>";
    }).join("");
    return '<div class="label">' + esc(l.label) + '</div><div class="row"><button class="btn" data-act="speak" type="button">' + (speaking ? "Stop reading" : "Read aloud") + '</button>' +
      '<select id="rate" aria-label="Reading speed"><option value="0.8">Slow</option><option value="1" selected>Normal</option><option value="1.25">Fast</option></select>' +
      '<button class="btn ghost" data-act="done" type="button">' + (studied[cur] ? "Studied (undo)" : "Mark as studied") + '</button></div>' +
      '<div class="read">' + (paras || '<p class="empty">No readable text on this part.</p>') + '</div>';
  }

  function renderPoints(l) {
    if (!l.top.length) return '<p class="empty">This lesson has too little text to pick key points.</p>';
    return '<div class="label">Key sentences</div>' + l.top.map(function (s) { return '<p class="point">' + esc(s) + "</p>"; }).join("") +
      '<div class="label">Key terms</div><div class="chips">' + l.terms.map(function (t) { return '<span class="chip">' + esc(t) + "</span>"; }).join("") + "</div>" +
      '<p class="note">Key points are the sentences that use the most common words in your PDF. They are a guide, so always read the full lesson too.</p>';
  }

  function renderCards(l) {
    var c = l.cloze;
    if (!c.length) return '<p class="empty">This lesson has too little text to make flashcards.</p>';
    var s = state.cards && state.cards.lesson === cur ? state.cards : (state.cards = { lesson: cur, i: 0, shown: false });
    var q = c[s.i % c.length];
    var text = esc(q.text).replace("_____", s.shown ? '<span class="blank">' + esc(q.shown) + "</span>" : '<span class="blank">&nbsp;</span>');
    return '<div class="label">Card ' + (s.i % c.length + 1) + " of " + c.length + '</div><p class="q">' + text + "</p>" +
      '<div class="row"><button class="btn grow" data-act="flip" type="button">' + (s.shown ? "Hide answer" : "Show answer") + '</button><button class="btn ghost grow" data-act="nextcard" type="button">Next card</button></div>' +
      '<p class="note">Say the missing word first, then tap Show answer.</p>';
  }

  function renderQuiz(l) {
    var c = l.cloze;
    if (c.length < 2) return '<p class="empty">This lesson has too little text to make a quiz.</p>';
    var s = state.quiz && state.quiz.lesson === cur ? state.quiz : (state.quiz = { lesson: cur, i: 0, score: 0, picked: null, qs: shuffle(c).slice(0, 5) });
    if (s.i >= s.qs.length) {
      return '<div class="label">Quiz finished</div><p class="q">You got ' + s.score + " of " + s.qs.length + ' right.</p>' +
        '<div class="row"><button class="btn grow" data-act="retry" type="button">Try again</button><button class="btn ghost grow" data-act="done" type="button">' + (studied[cur] ? "Studied (undo)" : "Mark as studied") + "</button></div>";
    }
    var q = s.qs[s.i];
    return '<div class="label">Question ' + (s.i + 1) + " of " + s.qs.length + '</div><p class="q">' + esc(q.text).replace("_____", '<span class="blank">' + (s.picked ? esc(q.shown) : "&nbsp;") + "</span>") + "</p>" +
      '<div class="opts">' + q.opts.map(function (o) {
        var cls = "opt";
        if (s.picked) { if (o === q.answer) cls += " right"; else if (o === s.picked) cls += " wrong"; }
        return '<button class="' + cls + '" data-act="pick" data-o="' + esc(o) + '" type="button"' + (s.picked ? " disabled" : "") + ">" + esc(o) + "</button>";
      }).join("") + "</div>" +
      (s.picked ? '<div class="row"><button class="btn" data-act="nextq" type="button">' + (s.i + 1 === s.qs.length ? "See score" : "Next question") + "</button></div>" : "");
  }

  /* ---------- speech ---------- */
  function stopSpeech() { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {} speaking = false; }
  function speak() {
    if (!window.speechSynthesis) { setStatus("Reading aloud is not supported on this browser."); return; }
    if (speaking) { stopSpeech(); render(); return; }
    var rate = parseFloat(($("rate") || {}).value || "1");
    var paras = doc.lessons[cur].text.split(/\n+/).filter(Boolean), idx = 0;
    speaking = true; render();
    $("rate").value = String(rate);
    (function next() {
      if (!speaking || idx >= paras.length) { speaking = false; if (doc) render(); return; }
      var u = new SpeechSynthesisUtterance(paras[idx++]); u.rate = rate;
      u.onend = next; u.onerror = function () { speaking = false; render(); };
      window.speechSynthesis.speak(u);
    })();
  }

  /* ---------- events ---------- */
  $("file").addEventListener("change", function (e) { var f = e.target.files[0]; if (f) readPdf(f); e.target.value = ""; });
  $("sampleBtn").addEventListener("click", function () { load(SAMPLE, "sample"); });
  $("changeBtn").addEventListener("click", function () { stopSpeech(); doc = null; $("study").hidden = true; $("panel").hidden = true; $("intake").hidden = false; setStatus(""); });
  $("lessonSel").addEventListener("change", function (e) { stopSpeech(); cur = +e.target.value; state = {}; render(); });
  $("prevBtn").addEventListener("click", function () { if (cur > 0) { stopSpeech(); cur--; state = {}; render(); } });
  $("nextBtn").addEventListener("click", function () { if (cur < doc.lessons.length - 1) { stopSpeech(); cur++; state = {}; render(); } });
  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]"); if (!b) return; stopSpeech(); tab = b.getAttribute("data-tab"); render();
  });
  $("panel").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.getAttribute("data-act"), l = doc.lessons[cur];
    if (a === "speak") return speak();
    if (a === "done") { if (studied[cur]) delete studied[cur]; else studied[cur] = true; saveStudied(); render(); }
    if (a === "flip") { state.cards.shown = !state.cards.shown; render(); }
    if (a === "nextcard") { state.cards.i++; state.cards.shown = false; render(); }
    if (a === "pick") { var s = state.quiz; if (s.picked) return; s.picked = b.getAttribute("data-o"); if (s.picked === s.qs[s.i].answer) s.score++; render(); }
    if (a === "nextq") { state.quiz.i++; state.quiz.picked = null; render(); }
    if (a === "retry") { state.quiz = null; render(); }
  });
  window.addEventListener("pagehide", stopSpeech);
  if (typeof pdfjsLib === "undefined") setStatus("The PDF reader did not load, but you can still try the sample.");
  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
})();
</script>
</body>
</html>
